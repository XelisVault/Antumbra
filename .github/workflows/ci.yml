# ANTUMBRA continuous integration — the CI wall.
#
# Every push and every pull request runs the full battery. A red
# check on main blocks the phase: no exception, no bypass. Branch
# protection requires every job below before a merge, and the
# merge-rails job routes each pull request through the rails of
# CONTRIBUTING.md (consensus changes are rail-C merges with an ADR
# in the diff). This is the executable layer of the verification
# method: cross vectors, deterministic simulation, reproducible
# sources, honest builds.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: code

  clippy:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: code
      - name: Lint (zero warnings tolerated)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        working-directory: code

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: code
      - name: Unit, integration and cross-implementation vector tests
        run: cargo test --workspace --locked
        working-directory: code
      - name: Documentation tests
        run: cargo test --workspace --doc --locked
        working-directory: code

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: code
      - name: The declared minimum supported Rust version still builds everything
        run: cargo build --workspace --locked --all-targets
        working-directory: code

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: code
      - name: Debug build (locked)
        run: cargo build --workspace --locked --all-targets
        working-directory: code
      - name: Release build (locked)
        run: cargo build --workspace --release --locked
        working-directory: code

  node-day:
    name: Node day
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: code
      - name: The devnet day slice, twice, deterministically
        run: |
          set -euo pipefail
          cargo run --release --locked --bin antumbra-node -- genesis
          cargo run --release --locked --bin antumbra-node -- day --blocks 1200 > day-one.txt
          cargo run --release --locked --bin antumbra-node -- day --blocks 1200 > day-two.txt
          one=$(grep 'status id' day-one.txt | awk '{print $NF}')
          two=$(grep 'status id' day-two.txt | awk '{print $NF}')
          if [ -z "$one" ] || [ "$one" != "$two" ]; then
            echo "the day is not deterministic: $one vs $two"
            exit 1
          fi
          grep -q 'invariants          held' day-one.txt
          echo "the day slice holds: status id $one"
        working-directory: code

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build docs (broken links are errors)
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"
        working-directory: code

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit dependencies for known vulnerabilities
        run: cargo audit
        working-directory: code

  deny:
    name: Licenses and bans
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Check licenses, advisories and duplicate versions
        run: cargo deny --workspace check advisories bans licenses sources
        working-directory: code

  vectors:
    name: Vector regeneration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install generator dependencies
        run: pip install -r scripts/requirements.txt
        working-directory: code
      - name: Regenerate the eleven vector sets
        run: |
          python3 scripts/gen_vectors.py
          python3 scripts/gen_tx_vectors.py
          python3 scripts/gen_veil_vectors.py
          python3 scripts/gen_dag_vectors.py
          python3 scripts/gen_ring_vectors.py
          python3 scripts/gen_kleos_vectors.py
          python3 scripts/gen_immune_vectors.py
          python3 scripts/gen_agents_vectors.py
          python3 scripts/gen_jobs_vectors.py
          python3 scripts/gen_forge_vectors.py
          python3 scripts/gen_state_vectors.py
        working-directory: code
      - name: The archived vector sets are well-formed
        run: |
          python3 - <<'PYEOF'
          import glob
          import json

          files = sorted(glob.glob("crates/*/tests/vectors.json"))
          assert len(files) == 11, f"expected 11 archived vector sets, found {len(files)}"
          for path in files:
              with open(path, encoding="utf-8") as handle:
                  data = json.load(handle)
              assert data.get("format") == 1, f"{path}: unexpected format field"
              print(f"vector set ok: {path}")
          PYEOF
        working-directory: code
      - name: The committed vectors are exactly the regenerated ones
        run: git diff --exit-code -- crates
        working-directory: code

  simulation:
    name: Social core regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install simulation dependencies
        run: pip install -r simulations/requirements.txt
      - name: Kleos simulation (rules R1 to R4 must hold)
        run: python3 kleos.py
        working-directory: simulations
      - name: Emission calendar (cap must be exact)
        run: python3 emission.py
        working-directory: simulations
      - name: Machine-economy simulation (caps and Senate must hold)
        run: python3 agents.py
        working-directory: simulations
      - name: Determinism gate (two runs, byte-identical stdout)
        run: |
          python3 kleos.py > /tmp/kleos-run1.txt
          python3 kleos.py > /tmp/kleos-run2.txt
          cmp /tmp/kleos-run1.txt /tmp/kleos-run2.txt || { echo "kleos.py output is not deterministic"; exit 1; }
          python3 emission.py > /tmp/emission-run1.txt
          python3 emission.py > /tmp/emission-run2.txt
          cmp /tmp/emission-run1.txt /tmp/emission-run2.txt || { echo "emission.py output is not deterministic"; exit 1; }
          python3 agents.py > /tmp/agents-run1.txt
          python3 agents.py > /tmp/agents-run2.txt
          cmp /tmp/agents-run1.txt /tmp/agents-run2.txt || { echo "agents.py output is not deterministic"; exit 1; }
          echo "determinism: all three engines are byte-identical across runs"
        working-directory: simulations

  whitepaper:
    name: Whitepaper build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install figure dependencies
        run: pip install matplotlib
      - name: Regenerate the two figures from the deterministic engines
        run: |
          python3 docs/whitepaper/src/gen_figures.py | tee /tmp/figures.log
          grep -q 'sum == cap: True' /tmp/figures.log || { echo "emission figure: the cap arithmetic no longer closes"; exit 1; }
      - name: Install tectonic (pinned, the binary tested locally)
        run: |
          curl -fsSL "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.15.0/tectonic-0.15.0-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          install -m 0755 tectonic /usr/local/bin/tectonic
          tectonic --version
      - name: Compile the whitepaper from source
        run: tectonic docs/whitepaper/src/main.tex

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install YAML checker
        run: pip install pyyaml
      - name: Conflict markers, whitespace, newlines, encodings, syntax
        run: bash ci/check_repo_hygiene.sh

  rails:
    name: Merge rails
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - name: Route the diff through the rails (policy-as-code)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAILS_EVENT: ${{ github.event_name }}
          RAILS_PR_NUMBER: ${{ github.event.pull_request.number }}
          RAILS_REPOSITORY: ${{ github.repository }}
        run: python3 ci/merge_rails.py
