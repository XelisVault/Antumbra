# ANTUMBRA node workspace.
#
# One crate per whitepaper subsystem, one milestone at a time:
# the roadmap codes the foundations first, the social layers last.
# See spec/adr/ and docs/whitepaper/ for the decisions this code
# implements.

[workspace]
resolver = "2"
members = [
    "crates/antumbra-primitives",
    "crates/antumbra-tx",
    "crates/antumbra-veil",
    "crates/antumbra-dag",
    "crates/antumbra-ring",
    "crates/antumbra-kleos",
    "crates/antumbra-immune",
    "crates/antumbra-agents",
    "crates/antumbra-jobs",
    "crates/antumbra-forge",
    "crates/antumbra-state",
    "crates/antumbra-node",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/XelisVault/Antumbra"
rust-version = "1.85"

[workspace.dependencies]
# Consensus-critical primitives: small, audited, pure Rust.
tiny-keccak = { version = "2.0", default-features = false, features = ["keccak"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["fast", "std"] }
curve25519-dalek = { version = "5.0", default-features = false, features = ["precomputed-tables", "zeroize"] }
sha2 = { version = "0.11", default-features = false }
subtle = { version = "2.6", default-features = false }
antumbra-primitives = { path = "crates/antumbra-primitives", version = "0.1.0" }
antumbra-dag = { path = "crates/antumbra-dag", version = "0.1.0" }
antumbra-tx = { path = "crates/antumbra-tx", version = "0.1.0" }
antumbra-state = { path = "crates/antumbra-state", version = "0.1.0" }

# Test-only: reading the archived cross-implementation vectors.
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
