# The immunity layer: Thymus (ADR-020).
#
# The always-on watchdog of the chain: the nine invariants, the
# canaries, the alert state machine (freeze an upgrade, never a
# payment), the automatic bounty, and the MTTD/MTTC/MTTR metrics
# that replace the word "perfect". Cross-validated against an
# independent implementation (code/scripts/gen_immune_vectors.py)
# over an archived vector set (tests/vectors.json).

