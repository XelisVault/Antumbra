# cargo-deny configuration.
#
# Advisories: no known vulnerability may ever reach main; the
# unmaintained advisory scope covers the whole dependency tree of
# workspace crates.
# Bans: duplicate crate versions are tracked loudly; new duplicates
# require a reviewed explicit skip below, never a silent accept.
# Licenses: permissive licenses only, no unknown terms.

[advisories]
yanked = "deny"
unmaintained = "transitive"

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[licenses]
confidence-threshold = 0.93
# The permissive set actually encountered in the dependency tree.
# Additions are deliberate, one per reviewed crate, never blanket.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "CC0-1.0", # tiny-keccak, the Keccak reference in Rust
    "Unicode-3.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
